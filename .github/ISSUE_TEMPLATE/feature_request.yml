name: Feature request
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        好的想法都欢迎！请描述清楚使用场景，帮助我们判断优先级。
  - type: textarea
    id: problem
    attributes:
      label: 想要解决什么问题？
      description: 当前有什么不便或缺失？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望如何实现或表现？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案（可选）
      description: 有没有其他可行的思路？
    validations:
      required: false
