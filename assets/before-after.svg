<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="使用凝焦前（满屏干扰）与使用后（只留焦点窗口清晰）的对比">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e17"/>
      <stop offset="1" stop-color="#111524"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d8ff7"/>
      <stop offset="1" stop-color="#4c7df3"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <radialGradient id="glow" cx="50%" cy="42%" r="60%">
      <stop offset="0" stop-color="#6d8ff7" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#6d8ff7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="600" height="630" fill="#0e1220" opacity="0.5"/>

  <!-- divider -->
  <line x1="600" y1="40" x2="600" y2="590" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1"/>

  <!-- LEFT: before (busy, sharp) -->
  <text x="60" y="70" fill="#a8b0c4" font-family="-apple-system, system-ui, sans-serif" font-size="22" font-weight="600">之前 · 满屏干扰</text>
  <g font-family="-apple-system, system-ui, sans-serif">
    <rect x="70" y="110" width="300" height="190" rx="14" fill="#1a2030" stroke="#ffffff" stroke-opacity="0.12"/>
    <rect x="70" y="110" width="300" height="26" rx="14" fill="#ffffff" fill-opacity="0.06"/>
    <rect x="90" y="160" width="200" height="9" rx="4" fill="#ffffff" fill-opacity="0.22"/>
    <rect x="90" y="180" width="150" height="9" rx="4" fill="#ffffff" fill-opacity="0.16"/>
    <rect x="90" y="200" width="230" height="9" rx="4" fill="#ffffff" fill-opacity="0.18"/>
    <rect x="90" y="220" width="120" height="9" rx="4" fill="#ffffff" fill-opacity="0.14"/>

    <rect x="300" y="190" width="270" height="170" rx="14" fill="#21283c" stroke="#ffffff" stroke-opacity="0.12"/>
    <rect x="320" y="226" width="90" height="16" rx="8" fill="#6d8ff7" fill-opacity="0.35"/>
    <rect x="320" y="256" width="180" height="9" rx="4" fill="#ffffff" fill-opacity="0.16"/>
    <rect x="320" y="276" width="140" height="9" rx="4" fill="#ffffff" fill-opacity="0.13"/>
    <rect x="440" y="256" width="100" height="9" rx="4" fill="#ffffff" fill-opacity="0.10"/>

    <rect x="150" y="330" width="320" height="180" rx="14" fill="#1c2333" stroke="#ffffff" stroke-opacity="0.12"/>
    <rect x="170" y="366" width="160" height="9" rx="4" fill="#ffffff" fill-opacity="0.18"/>
    <rect x="170" y="388" width="240" height="9" rx="4" fill="#ffffff" fill-opacity="0.14"/>
    <rect x="170" y="410" width="120" height="9" rx="4" fill="#ffffff" fill-opacity="0.12"/>

    <rect x="430" y="350" width="120" height="22" rx="11" fill="#6d8ff7" fill-opacity="0.30"/>
    <rect x="360" y="386" width="150" height="22" rx="11" fill="#ffffff" fill-opacity="0.10"/>
    <rect x="420" y="422" width="120" height="22" rx="11" fill="#6d8ff7" fill-opacity="0.25"/>

    <rect x="240" y="540" width="320" height="36" rx="18" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.10"/>
  </g>

  <!-- RIGHT: after (blurred bg + one sharp focus) -->
  <text x="660" y="70" fill="#eef1f8" font-family="-apple-system, system-ui, sans-serif" font-size="22" font-weight="600">之后 · 只留焦点</text>
  <g font-family="-apple-system, system-ui, sans-serif">
    <g filter="url(#soft)" opacity="0.55">
      <rect x="640" y="120" width="280" height="180" rx="14" fill="#1a2030"/>
      <rect x="850" y="200" width="260" height="160" rx="14" fill="#21283c"/>
      <rect x="700" y="330" width="300" height="170" rx="14" fill="#1c2333"/>
    </g>
    <ellipse cx="880" cy="320" rx="230" ry="150" fill="url(#glow)"/>
    <rect x="700" y="200" width="360" height="240" rx="16" fill="#161c2c" stroke="url(#accent)" stroke-width="2.5"/>
    <rect x="700" y="200" width="360" height="30" rx="16" fill="#ffffff" fill-opacity="0.06"/>
    <circle cx="722" cy="215" r="4" fill="#6d8ff7"/>
    <rect x="736" y="211" width="120" height="8" rx="4" fill="#a8b0c4"/>
    <rect x="724" y="262" width="250" height="11" rx="5" fill="#eef1f8" opacity="0.85"/>
    <rect x="724" y="288" width="300" height="11" rx="5" fill="#ffffff" opacity="0.6"/>
    <rect x="724" y="314" width="180" height="11" rx="5" fill="#ffffff" opacity="0.5"/>
    <rect x="724" y="340" width="260" height="11" rx="5" fill="#ffffff" opacity="0.4"/>
    <rect x="724" y="366" width="140" height="11" rx="5" fill="#ffffff" opacity="0.35"/>
  </g>

  <!-- center arrow -->
  <g>
    <circle cx="600" cy="315" r="26" fill="#0b0e17" stroke="#6d8ff7" stroke-width="2"/>
    <path d="M590 315h18m0 0l-7-7m7 7l-7 7" stroke="#6d8ff7" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
